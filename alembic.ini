# Migrari: `alembic upgrade head` (serverul le ruleaza oricum singur la pornire).
# URL-ul bazei vine din db.URL (variabila DATABASE_URL), nu de aici.
[alembic]
script_location = migrari

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
